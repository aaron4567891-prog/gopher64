name: Thor shader diagnostic APK
on:
  push:
    branches: [gopher64-thor-shader-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      RA_HARDCORE: 'false'
      NETPLAY_ID: dev
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-linux-android
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.2 ndk;29.0.14206865'
      - name: Build separate ARM64 diagnostic app
        working-directory: android-project
        run: |
          cargo install cargo-ndk --locked
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: gopher64-thor-shader-test
          path: android-project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
